name: Deploy Resonance to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Resonance.App/Resonance.App.csproj

      - name: Build
        run: dotnet build src/Resonance.App/Resonance.App.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/Resonance.App/Resonance.App.csproj --configuration Release --output ./publish

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: resonance-app
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
